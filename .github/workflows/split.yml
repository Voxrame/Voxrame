
name: Split repo into separate 'read-only' mods

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.VOXRAME_SPLIT_GITHUB_TOKEN }}

      - name: Configure GitHub Actions bot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Configure Git traffic routing through HTTPS token
        run: |
          git config --global url."https://x-access-token:${{ secrets.VOXRAME_SPLIT_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Init remotes
        run: |
          ./.build/init-remotes

      - name: Split repo
        if: github.ref_type == 'branch'
        run: |
          ./.build/split

      - name: Propagate tag
        if: github.ref_type == 'tag'
        run: |
          ./.build/propagate-tags "${{ github.ref_name }}"
